<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <style>
        #add:hover {
            opacity: 75%;
            cursor: pointer;
        }
        #calcsum:hover {
            opacity: 75%;
            cursor: pointer;
        }
        #calcaverage:hover {
            opacity: 75%;
            cursor: pointer;
        }
    </style>
    <div style="border: 3px solid black; border-radius: 50px; margin: 20px; padding: 20px; background-color: rgb(158, 247, 158); text-align: center;">
        <h1 style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; text-align: center;">Sum & Average Calculator</h1>
        <br>

        <input type="text" id="number" style="border: 3px solid black; background-color: pink;">
        <button id="add" style="border: 3px solid black; border-radius: 50px; padding: 10px; margin-left: 10px; background-color: lightcoral;">Add Number</button>
        <br><br>

        <button id="calcsum" style="border: 3px solid black; border-radius: 50px; padding: 10px; margin-left: 10px; background-color: rgb(188, 146, 236);">Calculate Sum</button>
        <button id="calcaverage" style="border: 3px solid black; border-radius: 50px; padding: 10px; margin-left: 10px; background-color: rgb(215, 228, 158);">Calculate Average</button>
        <br><br>

        <label id="myLabel" style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;"></label>
    </div>

    <script src="Sum-&-Average-Calculator.js"></script>
</body>
</html>
