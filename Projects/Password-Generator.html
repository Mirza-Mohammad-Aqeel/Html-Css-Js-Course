<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <style>
        #title:hover {
            opacity: 60%;
            cursor: pointer;
        }

        .mylabel:hover {
            opacity: 60%;
            cursor: pointer;
        }

        #gen:hover {
            opacity: 60%;
            cursor: pointer;
            transform: scale(1.02)
        }

        #gen {
            transform: transition 0.3 ease-in-out;
        }


    </style>
    <div style="border: 6px solid black; margin: 20px; padding: 20px; border-radius: 100px; text-align: center;">
        <h1 style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; " id="title">Password Generator</h1>
        <br><br>



        <select id="lowercase" style="padding: 10px; border: 5px solid black; border-radius: 10px;;">

            <option><b>True</b></option>
            <option><b>False</b></option>

        </select>

        <label class="mylabel" style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; margin-left: 20px;"><b>Lower-Case Characters Acceptable</b></label><br><br>

        <select id="uppercase" style="padding: 10px; border: 5px solid black; border-radius: 10px;;">

            <option><b>True</b></option>
            <option><b>False</b></option>

        </select>

        <label class="mylabel" style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; margin-left: 20px;"><b>Upper-Case Characters Acceptable</b></label><br><br>
       
        <select id="numbers" style="padding: 10px; border: 5px solid black; border-radius: 10px; margin-left: -100px;">

            <option><b>True</b></option>
            <option><b>False</b></option>

        </select>

        <label class="mylabel" style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; margin-left: 20px;"><b>Numbers Acceptable</b></label><br><br>        

        <select id="symbols" style="padding: 10px; border: 5px solid black; border-radius: 10px; margin-left: -105px;">

            <option><b>True</b></option>
            <option><b>False</b></option>

        </select>

        <label class="mylabel" style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; margin-left: 20px;"><b>Symbols Acceptable</b></label><br><br>                
        
        <input type="number" id="passlength" style="margin-left: -30px; border: 5px solid black; border-radius: 10px;">
        <label class="mylabel" style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; margin-left: 20px;"><b>Pass-Word Length</b></label><br><br>                
       


        
        <button style="border: 3px solid black; border-radius: 50px; background-color: lightcoral; padding: 20px; font-size: 15px; font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;" id="gen"><b>Generate Password</b></button>
        <br><br>

        <label id="pass" style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;"></label>
    </div>

    <script src="Password-Generator.js"></script>
</body>
</html>
