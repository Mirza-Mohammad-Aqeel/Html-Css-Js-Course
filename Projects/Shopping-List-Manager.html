<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <style>
        #adding:hover {
            opacity: 75%;
        }
        #removing:hover {
            opacity: 75%;
        }
        #print:hover {
            opacity: 75%;
        }
    </style>
    <div style="border: 3px solid black; padding: 20px; margin: 20px; border-radius: 50px; text-align: center;">
        <h1 style="text-align: center; font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;">Shopping Cart</h1>
        <br>

        <input type="text" id="item1" style="border: 3px solid black; font-size: 20px; margin-bottom: 15px;"><br>
        <button id="adding" style="padding: 10px; background-color: lightcoral; border: 3px solid black; border-radius: 50px; margin-left: 4px;">Add Item</button>
        <button id="removing" style="padding: 10px; background-color: rgb(177, 162, 245); border: 3px solid black; border-radius: 50px; margin-left: 4px;">Remove Item</button>
        <button id="print" style="padding: 10px; background-color: rgb(162, 215, 245); border: 3px solid black; border-radius: 50px; margin-left: 4px;">Print Cart</button>

        <br><br>
        <label id="mylabel"></label>
    </div>

    <script src="Shopping-List-Manager.js"></script>
</body>
</html>
