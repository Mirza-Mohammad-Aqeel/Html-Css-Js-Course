<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <style>
        #calcarea:hover {
            opacity: 75%;
        }
        #calcperi:hover {
            opacity: 75%;
        }
        #submitname:hover {
            opacity: 75%;
        }
    </style>

    <label style="margin-top: 20px; margin-left: 20px;">Enter your Name</label>
    <input type="text" id="users'name" style="margin-top: 20px; margin-left: 20px; background-color: rgb(101, 107, 101); border: 3px solid black;">
    <br>

    <button id="submitname" style="margin-left: 20px; margin-top: 10px; border: 3px solid black; background-color: lightskyblue;">Submit Name</button>
    <br><br>

    <h1 id="thegreeting" style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; margin-left: 20px;"><h1></h1>
    <br>

    <label id="asker" style="margin-left: 20px; display: none;">Enter your Rectangle's length & Width</label><br>

    <label id="1" style="margin-left: 20px; margin-top: 10px; display: none;">● Width</label>
    <input type="text" id="rectwidth" style="margin-left: 4px; margin-top: 10px; background-color: rgb(101, 107, 101); border: 3px solid black; display: none;"><br>

    <label id="2" style="margin-left: 20px; margin-top: 10px; display: none;">● Rectangle</label>
    <input type="text" id="rectlength" style="margin-left: 4px; margin-top: 10px; background-color: rgb(101, 107, 101); border: 3px solid black; display: none;"><br>

    <button id="calcarea" style="margin-top: 20px; margin-left: 20px; background-color: lightcoral; border: 3px solid black; display: none;">Calculate Area</button>
    <button id="calcperi" style="margin-left: 10px; background-color: rgb(174, 253, 164); border: 3px solid black; display: none;">Calculate Perimeter</button>
    <br><br>

    <label id="urvalue" style="margin-left: 20px; font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;"></label>
    <br><br>


    <script src="Area-Perimeter-Calculator.js"></script>
</body>
</html>
