<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <style>

        #guess:hover {
            opacity: 75%;
            cursor: pointer;
        }

    </style>
    <div style="border: 3px solid black; border-radius: 50px; margin: 20px; padding: 20px; text-align: center; background-color: rgb(196, 231, 161);">
        <h1 style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; text-align: center;">Number Guessing Game</h1>
        <br>

        <input type="number" style="border: 3px solid black; background-color: rgb(211, 182, 182); text-align: center;" min="0" max="100" id="number">
        <button style="border: 3px solid black; border-radius: 50px; font-size: 20px; padding: 5px; background-color: lightcoral; margin-left: 20px;" id="guess">Guess</button>
        <br><br>

        <label id="result" style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;"></label>

    </div>

    <script src="Number-Guessing-Game.js"></script>
</body>
</html>
