<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <style>


        .slider {
            position: relative;
            width: 100%;
            margin: auto;
            overflow: hidden;
        }

        .slider img {
            width: 100%;
            display: none;
        }

        img.displaySlide {
            display: block;
            animation-name: fade;
            animation-duration: 1.5s;
        }

        .slider button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            cursor: pointer;
        }

        #back {
            left: 0;
        }
        
        #forward {
            right: 0;
        }

        @keyframes fade {
            from {opacity: .5}
            to {opacity: 1}
        }
    </style>
    <div class="slider">
        <div class="slides">

            <img class="slide" src="redballoon.png">
            <img class="slide" src="blueballoon.png">
            <img class="slide" src="orangeballoon.png">

        </div>

        <button id="back" class="mybutton" onclick="goBack()"><</button>
        <button id="forward" class="mybutton" onclick="goForward()">></button>

    </div>
    <script src="Image-Slider.js"></script>
</body>
</html>
