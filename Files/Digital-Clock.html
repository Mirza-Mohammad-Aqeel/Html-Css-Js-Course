<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <style>
        body {
            background: rgb(225, 245, 173);
            margin: 30px;
        }
        #clock {
            border: 5px solid black;
            border-radius: 10px;;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: lightcoral;
        }

        #theclock {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 6.5rem;
            font-weight: bold;
            text-align:  center;
            
        }

        #theclock:hover {
            opacity: 60%;
            cursor: pointer;
        }
    </style>
    <div id="clock">
        <div id="theclock">00:00:00</div>
    </div>

    <script src="Digital-Clock.js"></script>
</body>
</html>
