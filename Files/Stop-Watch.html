<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: rgb(194, 179, 179);">

    <style>
        #myh1:hover {
            opacity: 60%;
            cursor: pointer;
        }
        
        
        #display:hover {
            opacity: 60%;
            cursor: pointer;

        }

        .aip {
            transition: background-color 0.5s ease;
            color: white;
            font-size: 1em;
            cursor: pointer;

        }

    </style>
    <h1 id="myh1" style="text-align: center; font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;">Stop-Watch</h1>
    <div id="container" style="border: 5px solid black; border-radius: 10px; background-color: white">
        <div id="display" style="text-align: center; padding:10px; font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; font-weight: bold; font-size: 2em;">
            00:00:00:00
        </div>
        <div id="controls" style="text-align: center; padding:10px; display: flex; flex-direction: row; gap: 20px; justify-content: center;">

            <button class="aip" id="startx" onclick="start()" style="background-color: red; padding:10px; border: none; border-radius: 10px; font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; font-weight: bold; padding:10px 20px;">Start</button>
            <button class="aip" id="stopx" onclick="stop1()" style="background-color: blue; padding:10px; border: none; border-radius: 10px; font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; font-weight: bold; padding:10px 20px;">Stop</button>
            <button class="aip" id="resetx" onclick="reset()" style="background-color: greenyellow; padding:10px; border: none; border-radius: 10px; font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; font-weight: bold; padding:10px 20px;">Reset</button>

        </div>
    </div>

    <script src="Stop-Watch.js"></script>
</body>
</html>
